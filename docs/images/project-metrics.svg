<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Network Shooter Portfolio 코드 수치</title>
  <desc id="desc">18개 코드 파일, 1057줄, 5개 RPC, 3가지 무기 판정 경로</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#17243a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#background)"/>
  <text x="44" y="48" fill="#e8eef7" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="600">공개 코드 기준</text>
  <g font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
    <g transform="translate(44,80)">
      <rect width="250" height="132" rx="12" fill="#1e304b"/>
      <text x="22" y="34" fill="#9fb1c9" font-size="16">코드 파일</text>
      <text x="22" y="89" fill="#6ee7c7" font-size="44" font-weight="700">18</text>
      <text x="78" y="88" fill="#d5dfed" font-size="18">개</text>
    </g>
    <g transform="translate(320,80)">
      <rect width="250" height="132" rx="12" fill="#1e304b"/>
      <text x="22" y="34" fill="#9fb1c9" font-size="16">C++ / 빌드 코드</text>
      <text x="22" y="89" fill="#6ee7c7" font-size="44" font-weight="700">1,057</text>
      <text x="143" y="88" fill="#d5dfed" font-size="18">줄</text>
    </g>
    <g transform="translate(596,80)">
      <rect width="250" height="132" rx="12" fill="#1e304b"/>
      <text x="22" y="34" fill="#9fb1c9" font-size="16">서버·클라이언트 RPC</text>
      <text x="22" y="89" fill="#6ee7c7" font-size="44" font-weight="700">5</text>
      <text x="50" y="88" fill="#d5dfed" font-size="18">개</text>
      <text x="22" y="116" fill="#9fb1c9" font-size="14">Server 4 · Client 1</text>
    </g>
    <g transform="translate(872,80)">
      <rect width="284" height="132" rx="12" fill="#1e304b"/>
      <text x="22" y="34" fill="#9fb1c9" font-size="16">서버 판정 경로</text>
      <text x="22" y="89" fill="#6ee7c7" font-size="44" font-weight="700">3</text>
      <text x="50" y="88" fill="#d5dfed" font-size="18">종</text>
      <text x="22" y="116" fill="#9fb1c9" font-size="14">히트스캔 · 투사체 · 샷건</text>
    </g>
